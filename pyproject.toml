[project]
name = "kladde"
version = "0.1.0"
description = "Internes Wiki: hierarchische Bereiche und Seiten, Markdown-Editor, Versionierung, Volltextsuche."
requires-python = ">=3.12"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: Depends() im Argument-Default ist FastAPIs Standardpattern, kein Fehler.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
